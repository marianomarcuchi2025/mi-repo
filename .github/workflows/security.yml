name: security
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: "0 5 * * *"}]
permissions: {contents: read, security-events: write}
jobs:
  bandit:
    name: "Bandit"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: pip install "bandit[toml,sarif]==1.8.6"
      - run: bandit -r . -f sarif -o bandit.sarif --severity-level medium || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: {sarif_file: bandit.sarif, category: bandit}
  semgrep:
    name: "Semgrep"
    runs-on: ubuntu-24.04
    container: {image: "semgrep/semgrep:latest"}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: semgrep ci --config=p/python --config=p/security-audit --sarif --output=semgrep.sarif || true
            - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor
    name: "zizmor"
    runs-on: ubuntu-24.04
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false}
      - run: pip install zizmor
            - name: zizmor (SARIF)
        continue-on-error: true
        run: |
          zizmor --format sarif . > zizmor.sarif 2>/dev/null || true
          # Si el SARIF está vacío o es inválido, escribir uno mínimo válido
          if [ ! -s zizmor.sarif ] || ! python3 -c "import json; json.load(open('zizmor.sarif'))" 2>/dev/null; then
            printf '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > zizmor.sarif
          fi
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: {sarif_file: zizmor.sarif, category: zizmor}
